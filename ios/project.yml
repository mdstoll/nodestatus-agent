name: NodeStatus
options:
  bundleIdPrefix: nl.merlinstoll
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: 43965PQW3Z
    CODE_SIGN_STYLE: Automatic
targets:
  NodeStatus:
    type: application
    platform: iOS
    sources:
      - path: NodeStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.merlinstoll.nodestatus
        PRODUCT_NAME: Node Status
        INFOPLIST_FILE: NodeStatus/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  NodeStatusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NodeStatusUITests
    dependencies:
      - target: NodeStatus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.merlinstoll.nodestatus.uitests
        TEST_TARGET_NAME: NodeStatus
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NodeStatus:
    build:
      targets:
        NodeStatus: all
        NodeStatusUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NodeStatusUITests
